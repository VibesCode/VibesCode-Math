# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Niu's candidate counterexamples to Erdős Problem 707 in cyclic planes of order divisible by 2 or 3"
  description: >-
    Erdős Problem 707 asks whether every finite Sidon set of natural numbers is contained in a
    perfect difference set. Every Sidon set of size 3 extends (Sawin), and Niu
    (arXiv:2604.25214) proposed {0,1,3,11} and {0,1,4,11} as size-4 counterexamples; Mueller
    showed they fail in every Singer (Desarguesian) difference set, but whether they extend to a
    non-Desarguesian cyclic plane is open. This formalization proves, in Lean 4 with Mathlib and
    only the standard axioms, two restrictions that need no assumption on the plane: (1) neither
    set lies in a perfect difference set of even order (any modulus n), by Baer's
    argument that 2 is then a multiplier; (2) {0,1,3,11} lies in no finite perfect difference set whose order is divisible by
    2 or by 3, by Hall's multiplier theorem, which is proved here from scratch for planar
    difference sets (Frobenius in the group algebra (ZMod p)[ZMod n]) with no prime-power
    assumption. The question for orders with all prime factors at least 5 (for {0,1,3,11}) and
    for odd orders (for {0,1,4,11}) is not settled.
  authors:
    - "VibesCode"
  license: "Apache-2.0"
  responsible_maintainers:
    - "VibesCode"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05B10", "51E15", "11B13"]

sources:
  - title: "Erdős Problem #707"
    authors:
      - "Paul Erdős"
    id: "https://www.erdosproblems.com/707"
    type: "web discussion"
    relationship: "background"
    note: "The problem: does every finite Sidon set extend to a perfect difference set?"
    author_endorsement: "n/a"
  - title: "Size-4 Counterexamples to the Sidon-Extension Conjecture"
    authors:
      - "Tong Niu"
    id: "arXiv:2604.25214"
    type: "paper"
    location: "https://arxiv.org/abs/2604.25214"
    relationship: "background"
    note: >-
      Source of the two candidate sets {0,1,3,11} and {0,1,4,11}. The paper (v1, v2) gives
      computational evidence and lists polarity and multiplier arguments as open routes; v3 was
      withdrawn in favour of Mueller's MathOverflow answer.
    author_endorsement: "not-contacted"
  - title: "MathOverflow question 501983, answer 502053 (Remark 2)"
    authors:
      - "Peter Mueller"
    id: "https://mathoverflow.net/a/502053"
    type: "web discussion"
    relationship: "formalizes"
    note: >-
      Remark 2 states without proof, for {0,1,3,11}, that "the Hall-Baer arguments" force the order
      q to be odd. Theorem (1) proves this observation, and the same statement for {0,1,4,11}.
      The answer also proves, by resultants, that both sets fail in every Singer difference set;
      that is a different restriction (plane type rather than order) and is not formalized here.
      In the same thread Mueller wrote that he did not see whether Hall's multiplier theorem helps;
      no written argument for orders divisible by 3 was found.
    author_endorsement: "not-contacted"
  - title: "MathOverflow question 501983, answer 501999"
    authors:
      - "Will Sawin"
    id: "https://mathoverflow.net/a/501999"
    type: "web discussion"
    relationship: "background"
    note: "Every Sidon set of size 3 extends; discusses the size-4 case and the difficulty of odd q."
    author_endorsement: "not-contacted"
  - title: "Forbidden Sidon subsets of perfect difference sets, featuring a human-assisted proof"
    authors:
      - "Boris Alexeev"
      - "Dustin G. Mixon"
    id: "arXiv:2510.19804"
    type: "paper"
    location: "https://arxiv.org/abs/2510.19804"
    relationship: "adapts"
    note: >-
      Their use of Baer's polarity facts for even and odd order (for {1,2,4,8} and {1,2,4,8,13})
      is the method of Theorem (1), applied here to Niu's sets.
    author_endorsement: "not-contacted"
  - title: "Polarities in finite projective planes"
    authors:
      - "Reinhold Baer"
    id: "Bull. Amer. Math. Soc. 52 (1946), 77–93"
    type: "paper"
    relationship: "background"
    note: "Baer's step behind Theorem (1): for even order, 2·S is a translate of S. Proved in Lean here for cyclic planes by a parity (involution) argument."
    author_endorsement: "n/a"
  - title: "Cyclic projective planes"
    authors:
      - "Marshall Hall Jr."
    id: "Duke Math. J. 14 (1947), 1079–1090"
    type: "paper"
    relationship: "background"
    note: "Hall's multiplier theorem, proved in Lean here for planar difference sets and used in Theorem (2)."
    author_endorsement: "n/a"
  - title: "formal-conjectures: FormalConjecturesForMathlib/Data/ZMod/PerfectDifferenceSet.lean"
    authors:
