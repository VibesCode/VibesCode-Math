    note: "Formal statements of Erdős 707 and of the Alexeev–Mixon results; no statement about {0,1,3,11} or {0,1,4,11}."

status:
  scope: >-
    Proved: (1) for every B ⊆ ℕ and n, if B is a perfect difference set modulo n and B.ncard is
    odd, then neither {0,1,3,11} nor {0,1,4,11} is a subset of B; (2) for every finite perfect
    difference set B modulo n with 2 ∣ |B| - 1 or 3 ∣ |B| - 1, {0,1,3,11} is not a subset of B.
    Not proved: any statement for orders whose prime factors are all at least 5 (for {0,1,3,11})
    or for odd orders (for {0,1,4,11}); Erdős Problem 707 itself is not settled.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic)"]
      framework: "n/a"
      tool_setup: "AI-assisted: the proof was written with AI assistance (Claude) and is checked by Lean 4 with Mathlib."
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    AI-assisted using Claude models, directed by VibesCode. The proof was written with AI
    assistance and is checked by Lean. The formal statements were compared against the sources.

fidelity:
  divergences: >-
    "Order q" is expressed through the size of the set, |B| = q + 1. In (1) the hypothesis Odd
    B.ncard also excludes infinite B, whose ncard is 0. The modulus n is arbitrary and no
    prime-power assumption is made.

review:
  status: "self-assessed"
  reviewers:
    - "none (no human expert review)"
  notes: >-
    The formal statements were compared against Niu's sets and Mueller's Remark 2. The proofs'
    correctness rests on the Lean check. No human mathematician has reviewed them.

