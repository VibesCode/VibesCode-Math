    id: "https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjecturesForMathlib/Data/ZMod/PerfectDifferenceSet.lean"
    type: "other"
    relationship: "other"
    license: "Apache-2.0"
    note: "The definition IsPerfectDifferenceSet is copied verbatim from this file."
    author_endorsement: "n/a"

