      lean: "niu_sets_not_in_even_order_pds"
      module: "Challenge"
      status: "proved"
      note: "Stated by Mueller for {0,1,3,11} without proof."
    - source: "new: orders divisible by 3 via Hall's multiplier theorem"
      lean: "niu_set_not_in_pds_of_order_div_two_or_three"
